# THEME: miyabi — dunst palette (Terafox teal)
[global]
    # Matches @active-border (#4D9C9F)
    frame_color = "#4D9C9F"
    format = "<span foreground='#4D9C9F' font_weight='bold'>%s</span>\n%b"

[urgency_low]
    # bg: terafox bg #152528 @ 0.65; fg: terafox fg @ 0.45
    background = "#152528A6"
    foreground = "#E6EAEA73"
    frame_color = "#2D4F5666" # terafox bg4 @inactive-border

[urgency_normal]
    background = "#152528A6"
    foreground = "#E6EAEA"
    highlight = "#4D9C9F"

[urgency_critical]
    # Terafox red for importance
    background = "#152528E6"
    foreground = "#E85C51"
    frame_color = "#E85C51"

[music]
    background = "#152528A6"
    foreground = "#A1CDD8" # Terafox cyan (matches Waybar audio icon)
