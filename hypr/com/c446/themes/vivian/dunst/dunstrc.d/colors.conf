# THEME: vivian — dunst palette (lavender)
[global]
    # Matches @active-border (#C0AAFF)
    frame_color = "#C0AAFF"
    # Summary uses the secondary iris color for the body text highlight
    format = "<span foreground='#C0AAFF' font_weight='bold'>%s</span>\n%b"

[urgency_low]
    # bg: @bg-base (rgba 42,30,48,0.65); fg: @text-dim (rgba 255,255,255,0.45)
    background = "#2A1E30A6"
    foreground = "#FFFFFF73"
    frame_color = "#403E5C66" # @inactive-border

[urgency_normal]
    background = "#2A1E30A6"
    foreground = "#FFFFFF"
    highlight = "#C0AAFF"

[urgency_critical]
    # Deep Vivian Purple bg, Vivian Pink fg/frame
    background = "#2A1E30E6"
    foreground = "#FF6188"
    frame_color = "#FF6188"

[music]
    background = "#2A1E30A6"
    foreground = "#78DCE8" # Iris Sky blue (matches Waybar audio icon)
