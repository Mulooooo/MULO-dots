# Hyprlock — colors follow Noctalia wallpaper and light/dark mode.
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor        = true
    ignore_empty_input = false
    text_trim          = true
    fractional_scaling = 2
    fail_timeout       = 2000
}

auth {
    pam:enabled = true
    pam:module  = hyprlock
}

animations {
    enabled = true
    bezier  = snappy, 0.1, 0.85, 0.15, 1.0
    animation = fade,             1, 1.8, snappy
    animation = fadeOut,          1, 1.5, snappy
    animation = inputFieldColors, 1, 2.5, snappy
    animation = inputFieldFade,   1, 2.0, snappy
    animation = inputFieldDots,   1, 1.0, snappy
}

# ─── Background ── blurred screenshot ─────────────────────────────────────

background {
    monitor     =
    path        = screenshot
    color       = rgba($nc_surface, 1)

    blur_passes       = 4
    blur_size         = 6
    noise             = 0.008
    contrast          = 0.88
    brightness        = 0.72
    vibrancy          = 0.12
    vibrancy_darkness = 0.04
}

# ─── Full-screen tint overlay ──────────────────────────────────────────────
# Theme surface tint keeps text readable in both light and dark mode.

shape {
    monitor  =
    size     = 10000, 10000
    color    = rgba($nc_surface, 0.85)
    rounding = 0
    halign   = center
    valign   = center
    position = 0, 0
    zindex   = 0
}

# ─── Top-left: user · host ─────────────────────────────────────────────────

label {
    monitor     =
    text        = cmd[update:0] echo "$USER  ·  $(hostname)"
    color       = rgba($nc_muted, 0.85)
    font_size   = 12
    font_family = MesloLGL Nerd Font Mono
    halign      = left
    valign      = top
    position    = 28, -22
    zindex      = 1
}

# ─── Clock ─────────────────────────────────────────────────────────────────

label {
    monitor     =
    text        = $TIME
    color       = rgba($nc_text, 0.95)
    font_size   = 88
    font_family = MesloLGL Nerd Font Mono
    halign      = center
    valign      = center
    position    = 0, 128
    zindex      = 1

    shadow_passes = 1
    shadow_size   = 3
    shadow_color  = rgba($nc_shadow, 0.50)
    shadow_boost  = 1.0
}

# ─── Date ──────────────────────────────────────────────────────────────────

label {
    monitor     =
    text        = cmd[update:60000] date "+%A, %d %B"
    color       = rgba($nc_muted, 0.85)
    font_size   = 15
    font_family = MesloLGL Nerd Font Mono
    halign      = center
    valign      = center
    position    = 0, 54
    zindex      = 1
}

# ─── Accent rule ───────────────────────────────────────────────────────────

shape {
    monitor  =
    size     = 280, 1
    color    = rgba($nc_primary, 0.30)
    rounding = 0
    halign   = center
    valign   = center
    position = 0, 18
    zindex   = 1
}

# ─── Input field ───────────────────────────────────────────────────────────

input-field {
    monitor  =
    size     = 280, 44

    rounding          = 0
    outline_thickness = 1

    outer_color = rgba($nc_primary, 0.55)
    inner_color = rgba($nc_input, 0.90)
    font_color  = rgba($nc_text, 1)
    font_family = MesloLGL Nerd Font Mono

    dots_size        = 0.28
    dots_spacing     = 0.20
    dots_center      = true
    dots_rounding    = 0

    placeholder_text = <span foreground="##$nc_muted_hex">password</span>
    fade_on_empty    = true
    fade_timeout     = 3500

    check_color    = rgba($nc_secondary, 0.85)
    fail_color     = rgba($nc_error, 0.85)
    capslock_color = rgba($nc_tertiary, 0.85)

    fail_text = <span foreground="##$nc_error_hex">$FAIL</span>

    swap_font_color = false

    halign   = center
    valign   = center
    position = 0, -16
    zindex   = 2

    shadow_passes = 1
    shadow_size   = 12
    shadow_color  = rgba($nc_shadow, 0.55)
    shadow_boost  = 1.0
}

# ─── PAM hint ──────────────────────────────────────────────────────────────

label {
    monitor     =
    text        = $PAMPROMPT
    color       = rgba($nc_muted, 0.85)
    font_size   = 11
    font_family = MesloLGL Nerd Font Mono
    halign      = center
    valign      = center
    position    = 0, -68
    zindex      = 1
}

# ─── Bottom-right: keyboard layout ────────────────────────────────────────

label {
    monitor     =
    text        = $LAYOUT
    color       = rgba($nc_muted, 0.85)
    font_size   = 11
    font_family = MesloLGL Nerd Font Mono
    halign      = right
    valign      = bottom
    position    = -28, 22
    zindex      = 1
}